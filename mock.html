<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Motion Voting — Interactive Mock</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .demobar {
      position: sticky; top: 0; z-index: 40;
      background: #020617; border-bottom: 1px solid var(--line);
      padding: 10px 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .demobar .badge { background: #7c2d12; color: #fed7aa; font-size: .7rem; font-weight: 700; padding: 4px 8px; border-radius: 6px; }
    .demobar .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .demobar .seg button { background: var(--card2); color: var(--text); border: none; padding: 8px 14px; cursor: pointer; font-size: .9rem; }
    .demobar .seg button.on { background: var(--accent); color: #08233a; font-weight: 700; }
    .demobar .spacer { flex: 1; }
    .demobar .tool { background: var(--card2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: .82rem; }
    .qr-fake { width: 200px; height: 200px; margin: 0 auto; border-radius: 12px; background:
      repeating-conic-gradient(#0f172a 0% 25%, #e2e8f0 0% 50%) 50% / 22px 22px; opacity: .85; }
    .device { max-width: 430px; margin: 18px auto; border: 8px solid #0b1220; border-radius: 28px; overflow: hidden; box-shadow: var(--shadow); }
    .device .wrap { padding: 16px; }
  </style>
</head>
<body>
  <div class="demobar">
    <span class="badge">DEMO</span>
    <div class="seg">
      <button id="seg-voter" class="on" onclick="setView('voter')">📱 Voter</button>
      <button id="seg-admin" onclick="setView('admin')">🛡️ Leadership</button>
    </div>
    <span class="spacer"></span>
    <button class="tool" onclick="simulate(26)">🎲 Simulate 26 votes</button>
    <button class="tool" onclick="resetDemo()">♻️ Reset</button>
  </div>

  <div id="app"></div>
  <div id="toast" class="toast hide"></div>

<script>
/* ============================================================================
   STANDALONE INTERACTIVE MOCK — mirrors the real app's behaviour in-memory.
   Nothing is saved. Refresh or hit Reset to start over.
   (The live app uses Firebase + GitHub Pages; this file needs neither.)
   ============================================================================ */

// ---- DEMO roster (weights here are EXAMPLES so you can see ½ and 0 in action;
//      the real weights come from js/roster.js) -------------------------------
const G2 = new Set(["Jason Lam","Alex Chan","Karen Ho","Maria Leis","Tom Klosek","Vivian Tam"]); // ½ pt
const CY = new Set(["Diana","Alx Florea"]);                                                       // no vote
const NAMES = ["Adam Kaufman","Adil Shamji","Alex Chan","Alvin Yang","Alx Florea","Amanda Fitzgibbon","Andrea Lo","Andrew Maeng","Andrew Shum","Angela Marrocco","Aran Balachandran","Brandon Lam","Brendan McCullough","Brittany Cameron","Cristina Pastia","Dan Tsoy","David Ng","David Phillips","David Rosenstein","David Sheps","David Smith","Diana","Eileen Cheung","Fatemeh Bakhtiari","Francis Sem","Fraser Kegel","George Porfiris","Henry Becker","Indy Sahota","Jack Hickey","James Fairbairn","Jane Wang","Jason Lam","Jefferson Hayre","Justin Losier","Karen Ho","Kasia Stefanski","Kate Lazier","Kristin Malcolm","Kyle Vojdani","Lingli Ma","Lisa Ballinger","Lucas Mastropaolo","Luke Kyne","Manpreet Lamba","Maria Leis","Marlee Klaiman","Matthew Skelly","Mazen Jazi","Meg Reynolds","Michael Charnish","Muneesh Jha","Nadia Incardona","Nadia Primiani","Natalie Mamen","Nicole Falzone","Nima Farkhani","Rajani Vairavanathan","Rakesh Kumar","Rana Kamhawy","Rebecca Chang","Rey Kishmiri","Rob Soegtrop","Ruchi Mohindra","Russell Bahar","Ryan Gotesman","Santosh Kanjeekal","Sara Brade","Sebastian Przech","Tania Philip","Tom Klosek","Vivian Tam","Walter Himmel","Yusuf Malik"];
const slugify = (n) => n.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const ROSTER = NAMES.map(n => ({ name:n, slug:slugify(n), group: CY.has(n)?"courtesy":G2.has(n)?"2":"1", weight: CY.has(n)?0:G2.has(n)?0.5:1 })).sort((a,b)=>a.name.localeCompare(b.name));
const ROSTER_BY_SLUG = Object.fromEntries(ROSTER.map(p=>[p.slug,p]));
const ELIGIBLE = ROSTER.filter(p=>p.weight>0).length;
const QUORUM = 24;

// ---- in-memory state -------------------------------------------------------
let view = "voter", adminTab = "results", me = null, mySession = "demo-device-A";
let polls, votes;
function defaults() {
  polls = [
    { id:"m1", text:"Motion to approve the proposed summer on-call schedule as circulated.", status:"open",  resultsVisible:true },
    { id:"m2", text:"Motion to adopt the revised Alternate Funding Arrangement (AFA) distribution model.", status:"draft", resultsVisible:true },
  ];
  votes = { m1:{}, m2:{} };
}
defaults();

// ---- shared logic (same rules as the real app) -----------------------------
function effW(v){ return typeof v.weightOverride==="number" ? v.weightOverride : v.weight; }
function tally(map){
  const list = Object.values(map);
  const w={favour:0,against:0,abstain:0}, c={favour:0,against:0,abstain:0}, voters=new Set();
  let flags=0, writeIns=0;
  for(const v of list){ const e=effW(v); if(v.choice in w){w[v.choice]+=e;c[v.choice]++;} if(e>0)voters.add(v.slug); if(v.flagged)flags++; if(v.isWriteIn)writeIns++; }
  return { weight:w, count:c, total:list.length, quorumCount:voters.size, flags, writeIns };
}
function openPoll(id){ polls.forEach(p=>{ if(p.id===id)p.status="open"; else if(p.status==="open")p.status="closed"; }); }
function castVote(pollId, voter, choice, session){
  const m = votes[pollId]; const ex = m[voter.slug];
  if(!ex){ m[voter.slug] = { ...voter, choice, sessionIds:[session], submissionCount:1, flagged:false }; }
  else { const s = ex.sessionIds.includes(session)?ex.sessionIds:[...ex.sessionIds,session]; ex.choice=choice; ex.sessionIds=s; ex.submissionCount++; ex.flagged=s.length>1; }
}

// ---- view router -----------------------------------------------------------
function setView(v){ view=v; document.getElementById("seg-voter").classList.toggle("on",v==="voter"); document.getElementById("seg-admin").classList.toggle("on",v==="admin"); render(); }
function render(){ document.getElementById("app").innerHTML = view==="voter" ? voterHTML() : adminHTML(); }

// ========================= VOTER ===========================================
function voterHTML(){
  const open = polls.find(p=>p.status==="open");
  let inner;
  if(!me){
    inner = `
      <div class="disclaimer">⚠️ Please select <strong>your own name only</strong>, and vote once. Votes are linked to your name and reviewed for duplicates.</div>
      <label>Find your name</label>
      <input id="search" type="text" placeholder="Start typing your name…" oninput="renderNames(this.value)" autocomplete="off"/>
      <ul id="namelist" class="namelist"></ul>
      <button class="btn ghost" style="margin-top:12px" onclick="toggleWritein()">My name isn't listed — add it</button>
      <div id="writein-box" class="hide" style="margin-top:12px">
        <label>Type your full name</label>
        <input id="writein" type="text" placeholder="First Last" autocomplete="off"/>
        <button class="btn accent" onclick="doWritein()">Continue</button>
      </div>`;
  } else if(open){
    const mine = votes[open.id][me.slug];
    inner = `
      <div class="spread"><span class="muted">Voting as <strong>${esc(me.name)}</strong>${me.isWriteIn?" (new — pending review)":""}</span>
        <a href="#" onclick="resetVoter(event)" class="sub">Not you?</a></div>
      <span class="pill open">● VOTING OPEN</span>
      <h2 style="margin-top:10px">${esc(open.text)}</h2>
      ${me.weight===0?`<p class="disclaimer">Your vote is recorded but currently carries <strong>no weight</strong>${me.isWriteIn?" (pending leadership review)":""}.</p>`:""}
      <div class="choice-row">
        <button class="btn favour ${mine&&mine.choice==="favour"?"selected":""}" onclick="vote('favour')">👍 In favour</button>
        <button class="btn against ${mine&&mine.choice==="against"?"selected":""}" onclick="vote('against')">👎 Against</button>
        <button class="btn abstain ${mine&&mine.choice==="abstain"?"selected":""}" onclick="vote('abstain')">➖ Abstain</button>
      </div>
      ${mine?`<p class="center muted" style="margin-top:14px">You voted <strong>${labelOf(mine.choice)}</strong>. You can change it until voting closes.</p>`:""}`;
  } else {
    const closed = [...polls].reverse().find(p=>p.status==="closed"&&p.resultsVisible);
    inner = `<div class="spread"><span class="muted">Voting as <strong>${esc(me.name)}</strong></span>
        <a href="#" onclick="resetVoter(event)" class="sub">Not you?</a></div>` +
      (closed ? resultBlock(closed,true) : `<div class="center" style="padding:24px 0"><div class="big">⏳</div><p class="muted">Waiting for the next motion to open…</p></div>`);
  }
  return `<div class="device"><div class="wrap">
    <h1>Emergency Medicine — Motion Voting</h1>
    <p class="sub">Tap to cast your vote. Live and anonymous to the group.</p>
    <div class="card">${inner}</div>
  </div></div>` + (me?"":namesScript());
}
function namesScript(){ setTimeout(()=>renderNames(""),0); return ""; }
function renderNames(filter){
  const el = document.getElementById("namelist"); if(!el) return;
  const f=(filter||"").trim().toLowerCase();
  const list = ROSTER.filter(p=>p.name.toLowerCase().includes(f));
  el.innerHTML = list.length ? list.map(p=>`<li onclick="pick('${p.slug}')">${p.name}</li>`).join("")
    : `<li class="muted" style="cursor:default">No match — use “add it” below.</li>`;
}
function pick(slug){ const p=ROSTER_BY_SLUG[slug]; me={name:p.name,slug:p.slug,group:p.group,weight:p.weight,isWriteIn:false}; render(); }
function toggleWritein(){ document.getElementById("writein-box").classList.toggle("hide"); }
function doWritein(){ const n=document.getElementById("writein").value.trim(); if(n.length<3){toast("Please type your full name.");return;} const slug=slugify(n);
  me = ROSTER_BY_SLUG[slug] ? {...ROSTER_BY_SLUG[slug],isWriteIn:false} : {name:n,slug,group:"writein",weight:0,isWriteIn:true}; render(); }
function resetVoter(e){ e.preventDefault(); me=null; render(); }
function vote(choice){ const open=polls.find(p=>p.status==="open"); castVote(open.id,me,choice,mySession); toast("Vote recorded: "+labelOf(choice)); render(); }

// ========================= LEADERSHIP ======================================
function adminHTML(){
  const tabBtn=(k,l)=>`<div class="tab ${adminTab===k?"active":""}" onclick="setTab('${k}')">${l}</div>`;
  let body="";
  if(adminTab==="share") body = shareTab();
  else if(adminTab==="motions") body = motionsTab();
  else if(adminTab==="results") body = resultsTab();
  else body = votersTab();
  return `<div class="wrap wide">
    <div class="spread"><h1>Leadership console</h1><span class="sub">demo — passcode gate skipped</span></div>
    <div class="tabs">${tabBtn("share","Share / QR")}${tabBtn("motions","Motions")}${tabBtn("results","Live results")}${tabBtn("voters","Voters")}</div>
    <section class="card">${body}</section>
  </div>`;
}
function setTab(t){ adminTab=t; render(); }

function shareTab(){
  return `<h2>Send voters here</h2>
    <p class="muted">Screen-share this QR code in the meeting, or share the link. Voters scan → pick their name → vote. No chat needed.</p>
    <div class="qr-fake" title="A real scannable QR code renders here in the live app"></div>
    <p class="center sub">↑ real app shows a scannable QR of your voting link</p>
    <label>Voting link</label>
    <div class="row"><input type="text" readonly value="https://your-name.github.io/ed-motion-voting/index.html"/><button class="btn accent small" onclick="toast('(demo) link copied')">Copy</button></div>
    <p class="sub">${ROSTER.length} physicians · ${ELIGIBLE} eligible · quorum = ${QUORUM}.</p>`;
}
function motionsTab(){
  const rows = polls.map(p=>`
    <div class="poll-item"><div class="text"><span class="pill ${p.status}">${p.status.toUpperCase()}</span> ${esc(p.text)}</div>
      <div class="row">
        ${p.status!=="open"?`<button class="btn favour small" onclick="mOpen('${p.id}')">Open</button>`:`<button class="btn against small" onclick="mClose('${p.id}')">Close</button>`}
        <button class="btn ghost small" onclick="mReveal('${p.id}')">${p.resultsVisible?"Hide result":"Reveal result"}</button>
        <button class="btn ghost small" onclick="mDel('${p.id}')">Delete</button>
      </div></div>`).join("");
  return `<h2>Motions</h2>
    <label>Add a motion</label>
    <textarea id="newm" placeholder="e.g. Motion to approve the proposed summer schedule as circulated."></textarea>
    <button class="btn accent" onclick="mAdd()">Add motion</button>
    <div style="margin-top:16px">${rows||'<p class="muted">No motions yet.</p>'}</div>`;
}
function displayPoll(){ return polls.find(p=>p.status==="open") || [...polls].reverse().find(p=>p.status==="closed"); }
function resultsTab(){
  const poll=displayPoll();
  if(!poll) return `<p class="muted">Open a motion to see live results.</p>`;
  return resultBlock(poll,false);
}
function resultBlock(poll, voterSide){
  const t=tally(votes[poll.id]); const met=t.quorumCount>=QUORUM; const pass=met && t.weight.favour>t.weight.against;
  const outcome = !met ? `<span class="result-noq">NO QUORUM${voterSide?"":" — cannot pass"}</span>`
    : pass?`<span class="result-pass">PASS${voterSide?"ED":"ES"} ✅</span>`:`<span class="result-fail">${voterSide?"DID NOT PASS":"DOES NOT PASS"} ❌</span>`;
  const max=Math.max(t.weight.favour,t.weight.against,t.weight.abstain,1);
  const bar=(k,l)=>`<div class="bar-row"><div class="bar-label"><span>${l}</span><span><strong>${fmt(t.weight[k])} pts</strong> · ${t.count[k]} ${t.count[k]===1?"vote":"votes"}</span></div><div class="bar-track"><div class="bar-fill ${k}" style="width:${t.weight[k]/max*100}%"></div></div></div>`;
  const controls = voterSide ? "" : `<div class="row" style="margin-top:6px">
      ${poll.status==="open"?`<button class="btn against small" onclick="mClose('${poll.id}')">Close voting</button>`:`<button class="btn favour small" onclick="mOpen('${poll.id}')">Re-open voting</button>`}
      <button class="btn ghost small" onclick="mReveal('${poll.id}')">${poll.resultsVisible?"Hide from group":"Reveal to group"}</button></div>`;
  return `<span class="pill ${poll.status}">${poll.status.toUpperCase()}</span> ${voterSide?"":`<span class="muted">${poll.resultsVisible?"visible to group":"hidden from group"}</span>`}
    <h2 style="margin-top:8px">${esc(poll.text)}</h2>
    <p class="center big">${outcome}</p>
    <div class="bars">${bar("favour","In favour")}${bar("against","Against")}${bar("abstain","Abstain")}</div>
    <div class="card" style="background:var(--card2)"><div class="spread"><span>Quorum</span><span class="${met?"quorum-ok":"quorum-bad"}">${t.quorumCount} / ${QUORUM} ${met?"✅ met":"❌ NOT met"}</span></div>
      <div class="bar-track" style="margin-top:6px"><div class="bar-fill favour" style="width:${Math.min(100,t.quorumCount/QUORUM*100)}%"></div></div>
      ${!met?`<p class="sub" style="color:#fca5a5;margin:8px 0 0">Need ${QUORUM-t.quorumCount} more eligible voter(s) before this motion can be decided.</p>`:""}</div>
    ${voterSide?"":`<p class="sub">${t.total} ballots · ${t.writeIns} write-in(s) · ${t.flags} flagged. Pass rule: weighted <em>In favour</em> &gt; weighted <em>Against</em>; abstentions count to quorum only.</p>`}
    ${controls}`;
}
function votersTab(){
  const poll=displayPoll(); if(!poll) return `<p class="muted">No motion selected.</p>`;
  const list = Object.values(votes[poll.id]).sort((a,b)=>a.name.localeCompare(b.name));
  const rows = list.map(v=>{ const e=effW(v); const g=v.isWriteIn?"write-in":gLabel(v.group);
    return `<tr class="${v.flagged?"flagged":""}"><td>${esc(v.name)} ${v.flagged?'<span class="pill flag">REVIEW</span>':""}${v.isWriteIn?'<span class="pill draft">NEW</span>':""}</td>
      <td>${g}</td><td>${fmt(e)}</td><td>${labelOf(v.choice)}</td><td>${v.submissionCount}×</td>
      <td><button class="btn ghost small" onclick="setW('${poll.id}','${v.slug}',1)">1</button><button class="btn ghost small" onclick="setW('${poll.id}','${v.slug}',0.5)">½</button><button class="btn ghost small" onclick="setW('${poll.id}','${v.slug}',0)">0</button><button class="btn ghost small" onclick="delV('${poll.id}','${v.slug}')">✕</button></td></tr>`;
  }).join("");
  return `<div class="spread"><h2 style="margin:0">Vote record</h2><button class="btn accent small" onclick="exportCsv()">Export CSV</button></div>
    <p class="sub">Motion: <em>${esc(poll.text)}</em> · ${list.length} ballots. Flagged = same name from 2+ devices.</p>
    <div style="max-height:60vh;overflow:auto"><table><thead><tr><th>Name</th><th>Group</th><th>Weight</th><th>Vote</th><th>Subs</th><th>Set weight / remove</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="6" class="muted">No votes yet — try “Simulate 26 votes”.</td></tr>'}</tbody></table></div>`;
}

// ---- admin actions ---------------------------------------------------------
function mAdd(){ const t=document.getElementById("newm").value.trim(); if(t.length<3){toast("Type the motion first.");return;} polls.push({id:"m"+(polls.length+1)+"-"+Math.floor(performance.now()),text:t,status:"draft",resultsVisible:true}); votes[polls[polls.length-1].id]={}; toast("Motion added"); render(); }
function mOpen(id){ openPoll(id); toast("Motion opened"); render(); }
function mClose(id){ const p=polls.find(x=>x.id===id); p.status="closed"; toast("Motion closed"); render(); }
function mReveal(id){ const p=polls.find(x=>x.id===id); p.resultsVisible=!p.resultsVisible; render(); }
function mDel(id){ if(confirm("Delete this motion?")){ polls=polls.filter(p=>p.id!==id); delete votes[id]; render(); } }
function setW(pid,slug,w){ votes[pid][slug].weightOverride=w; toast("Weight updated"); render(); }
function delV(pid,slug){ if(confirm("Remove this vote?")){ delete votes[pid][slug]; render(); } }

// ---- demo helpers ----------------------------------------------------------
function simulate(n){
  const open=polls.find(p=>p.status==="open"); if(!open){ toast("Open a motion first (Motions tab)."); return; }
  const pool = ROSTER.filter(p=>p.weight>0 && !votes[open.id][p.slug]);
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  pool.slice(0,n).forEach(p=>{ const r=Math.random(); const choice = r<0.6?"favour":r<0.85?"against":"abstain"; castVote(open.id,p,choice,"sim-"+p.slug); });
  toast(`Simulated ${Math.min(n,pool.length)} votes`); render();
}
function resetDemo(){ defaults(); me=null; toast("Demo reset"); render(); }
function exportCsv(){
  const poll=displayPoll(); const list=Object.values(votes[poll.id]).sort((a,b)=>a.name.localeCompare(b.name));
  const t=tally(votes[poll.id]);
  const L=["Name,Group,Weight,Vote,Submissions,Flagged,WriteIn"];
  list.forEach(v=>L.push([`"${v.name}"`, v.isWriteIn?"write-in":gLabel(v.group), effW(v), v.choice, v.submissionCount, v.flagged?"YES":"", v.isWriteIn?"YES":""].join(",")));
  L.push("",`"MOTION:","${poll.text}"`,`In favour (pts),${t.weight.favour}`,`Against (pts),${t.weight.against}`,`Abstain (pts),${t.weight.abstain}`,`Quorum,${t.quorumCount} of ${QUORUM}`,`Result,${t.quorumCount<QUORUM?"NO QUORUM":(t.weight.favour>t.weight.against?"PASSES":"DOES NOT PASS")}`);
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([L.join("\n")],{type:"text/csv"})); a.download="motion-result-demo.csv"; a.click();
}

// ---- utils -----------------------------------------------------------------
function gLabel(g){return g==="1"?"Group 1 (1)":g==="2"?"Group 2 (½)":g==="courtesy"?"Courtesy (0)":g;}
function labelOf(c){return c==="favour"?"In favour":c==="against"?"Against":c==="abstain"?"Abstain":c;}
function fmt(n){return Number.isInteger(n)?n:Number(n).toFixed(1);}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
let tt; function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.remove("hide");clearTimeout(tt);tt=setTimeout(()=>el.classList.add("hide"),2000);}

render();
</script>
</body>
</html>
