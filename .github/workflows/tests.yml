name: Tests

# Runs the same two test sets as on Alvin's Mac (see tests/README.md) on every
# push to any branch and on every pull request. Changes nothing live: the
# browser tests stub Firebase and the rules tests use the local emulator.
on:
  push:
    branches: ['**']
  pull_request:

# Only the newest commit on a branch matters; an older run still going is cancelled.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Same conventions as patient-hub's ci.yml: a named runner image (not
# ubuntu-latest), GitHub-authored actions only, each pinned by commit hash,
# and a short timeout on every job so a hung test cannot run for six hours.
jobs:
  rules:
    name: Database rules (Firestore emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/rules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Firestore emulator is a Java program.
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/rules/package-lock.json

      # firebase-tools downloads the emulator on first use; keep it between runs.
      - name: Cache the Firestore emulator download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('tests/rules/package-lock.json') }}

      - name: Install test tools
        run: npm ci

      - name: Run the rules tests
        run: npm test

  browser:
    name: Browser tests (Playwright, Firebase stubbed)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt

      - name: Install Playwright and Chromium
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run the browser tests
        run: python -m unittest discover -s tests -v
